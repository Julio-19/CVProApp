<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/CVProApp/">
  <script>
    const path = window.location.pathname;
    if (path === '/CVProApp/' || path === '/') {
      window.location.href = '/CVProApp/';
    } else {
      const newPath = '/CVProApp/' + path.replace('/CVProApp/', '').replace(/^\//, '');
      window.location.href = newPath;
    }
  </script>
</head>
<body>
  <p>Redirection vers l'application...</p>
</body>
</html>
