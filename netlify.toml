[build]
  command = "npx expo export --platform web && sed -i 's/<script src=\"\\/_expo/<script type=\"module\" src=\"\\/_expo/g' dist/index.html && sed -i 's|</head>|<script src=\"https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js\"></script></head>|' dist/index.html && cp dist/index.html dist/404.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"